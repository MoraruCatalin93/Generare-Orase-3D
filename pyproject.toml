[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terragen-web"
version = "2.0.0"
description = "Orașe 3D din date reale (OpenStreetMap + DEM) — generate în browser, fără Unity/Blender"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mapbox_earcut>=1.0",
    "Pillow>=10.0",
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
terragen = "terragen.cli_main:main"

[tool.setuptools]
packages = ["terragen"]

[tool.setuptools.package-data]
terragen = ["web/ui/*", "web/ui/vendor/*", "web/viewer/*", "web/viewer/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:shapely.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "terragen/web/viewer/vendor",
    "terragen/web/ui/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # lungimea liniei e gestionată de formatter
    "B008",    # Flask: funcții în argumente de decorator
    "RUF001",  # caractere unicode în textele românești (diacritice, săgeți)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"terragen/pbflite.py" = ["B905"]
